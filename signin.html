<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Danny Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Georgia, serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eaf3ff, #ffffff);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(37, 99, 235, 0.15);
            border: 1px solid #dbeafe;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .welcome {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-size: 15px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            color: #1e293b;
            background: #ffffff;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #2563eb;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 5px 0 24px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
        }

        .remember input {
            accent-color: #2563eb;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .signin-btn {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signin-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .signup-text {
            text-align: center;
            color: #64748b;
            font-size: 15px;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 28px;
        }

        @media (max-width: 380px) {
            .login-container {
                padding: 28px 20px;
            }

            .options {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">DANNY HUB</div>
        <p class="subtitle">Your Digital Services Partner</p>

        <h2>Welcome Back!</h2>
        <p class="welcome">Sign in to access your account.</p>

        <div id="message" class="message" role="status"></div>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >Show</button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit" class="signin-btn">
                Sign In
            </button>

        </form>

        <div class="divider">OR</div>

        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

        <div class="footer">
            &copy; 2026 Danny Hub. All rights reserved.
        </div>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "Hide" : "Show";
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            message.style.display = "block";
            message.style.background = "#eff6ff";
            message.style.color = "#1d4ed8";
            message.textContent =
                "The sign-in design is ready, but authentication has not been connected yet. Connect your website to a secure authentication service before signing users in.";
        });
    </script>

</body>
  </html>
